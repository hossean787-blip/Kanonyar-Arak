  <path d="M82 24Q78 32 72 36" stroke="#8b5520" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="69" cy="38" rx="5" ry="3" fill="#e08840" transform="rotate(-45 69 38)"/>
