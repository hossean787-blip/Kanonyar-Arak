<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 130">
  <defs>
    <linearGradient id="bg3" x2="0.5" y2="1">
      <stop stop-color="#e06c38"/>
      <stop offset="1" stop-color="#8c3010"/>
    </linearGradient>
  </defs>
  <rect width="110" height="130" rx="8" fill="url(#bg3)"/>
  <!-- Canvas/frame -->
  <rect x="20" y="18" width="70" height="70" rx="6" fill="#f9ede0" stroke="#f0c8a0" stroke-width="2"/>
  <!-- Painting brush strokes mockup -->
  <ellipse cx="45" cy="38" rx="16" ry="12" fill="#e08030" opacity="0.8"/>
  <ellipse cx="68" cy="45" rx="12" ry="10" fill="#5b8de0" opacity="0.8"/>
  <ellipse cx="50" cy="60" rx="18" ry="10" fill="#68c472" opacity="0.7"/>
  <ellipse cx="72" cy="62" rx="10" ry="8" fill="#e05070" opacity="0.75"/>
  <!-- Palette circles -->
  <g>
    <circle cx="28" cy="77" r="5" fill="#ff6b2b" stroke="white" stroke-width="1.5"/>
    <circle cx="40" cy="77" r="5" fill="#2b7fff" stroke="white" stroke-width="1.5"/>
    <circle cx="52" cy="77" r="5" fill="#2bc455" stroke="white" stroke-width="1.5"/>
    <circle cx="64" cy="77" r="5" fill="#ff4466" stroke="white" stroke-width="1.5"/>
