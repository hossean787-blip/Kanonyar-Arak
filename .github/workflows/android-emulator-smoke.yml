name: Kanonha physical-like emulator launch smoke
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/android-emulator-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [33, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM for emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android emulator install, launch and native UI smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            gradle :app:assembleDebug --no-daemon
            test -s app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm list packages | grep -F 'package:ir.kanonha.app.test'
            adb shell am start -W -n ir.kanonha.app.test/ir.kanonha.app.MainActivity
            sleep 12
            adb shell pidof ir.kanonha.app.test
            adb shell dumpsys activity activities > /tmp/kanonha-activities.txt
            grep -F 'ir.kanonha.app.test' /tmp/kanonha-activities.txt
            mkdir -p emulator-evidence
            adb shell screencap -p /sdcard/kanonha-foreground.png
            adb pull /sdcard/kanonha-foreground.png emulator-evidence/kanonha-foreground-api-${{ matrix.api }}.png
            adb logcat -d -v time AndroidRuntime:E > emulator-evidence/android-runtime-api-${{ matrix.api }}.log || true
            if grep -E 'FATAL EXCEPTION|Process: ir.kanonha.app.test' emulator-evidence/android-runtime-api-${{ matrix.api }}.log; then
              echo 'AndroidRuntime exception detected' >&2
              exit 1
            fi
            adb shell input keyevent KEYCODE_HOME
            sleep 2
            adb shell am start -W -n ir.kanonha.app.test/ir.kanonha.app.MainActivity
            sleep 3
            adb shell pidof ir.kanonha.app.test
      - name: Preserve emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanonha-emulator-api-${{ matrix.api }}-launch
          path: emulator-evidence/
          if-no-files-found: warn
