name: Kanonha signed in-place upgrade APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Locate original release signing key among repository Secrets without exposing values
        shell: bash
        env:
          AVAILABLE_SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          set -euo pipefail
          set +x
          python3 <<'PY'
          import os,json,re,base64,subprocess,sys
          from pathlib import Path
          secrets=json.loads(os.environ.get("AVAILABLE_SECRETS_JSON","{}"))
          EXPECTED="49:AC:F9:37:24:A8:5D:76:EA:26:F1:05:11:B1:52:B0:D4:43:E8:AC:0E:F2:D7:A8:82:DB:C2:29:B2:64:53:D5"
          def key_candidate(name):
              n=name.upper()
              if any(x in n for x in ("PASSWORD","PASS","ALIAS","TOKEN","API","PAT")): return False
              return (any(x in n for x in ("KEYSTORE","KEY_STORE","P12","JKS"))
                      or (any(x in n for x in ("KANONHA","RELEASE","ANDROID")) and any(x in n for x in ("SIGNING_KEY","PRIVATE_KEY","KEY_FILE"))))
          def password_candidate(name):
              n=name.upper()
              return ("PASS" in n and any(x in n for x in ("STORE","KEY","SIGN","KANONHA","RELEASE","ANDROID")))
          keystores=[(k,v) for k,v in secrets.items() if key_candidate(k) and isinstance(v,str) and len(v)>80]
          passwords=[(k,v) for k,v in secrets.items() if password_candidate(k) and isinstance(v,str) and v]
          tmp=Path(os.environ["RUNNER_TEMP"])/"kanonha-release.p12"
          found=None
          for key_name,value in keystores:
              try:
                  data=base64.b64decode("".join(value.split()),validate=True)
              except Exception:
                  continue
              if len(data)<100 or len(data)>4_000_000 or not data.startswith(b"\x30"):
                  continue
              tmp.write_bytes(data)
              tmp.chmod(0o600)
              for password_name,password in passwords:
                  try:
                      result=subprocess.run(["keytool","-list","-v","-keystore",str(tmp),"-storepass",password],
                                            capture_output=True,text=True,timeout=12)
                  except Exception:
                      continue
                  if result.returncode: continue
                  for section in re.split(r"(?=Alias name: )",result.stdout):
                      if EXPECTED not in section.upper() or "PRIVATEKEYENTRY" not in section.upper(): continue
                      match=re.search(r"(?m)^Alias name: (.+?)\s*$",section)
                      if match:
                          found=(password,match.group(1))
                          break
                  if found: break
              if found: break
          if not found:
              tmp.unlink(missing_ok=True)
              print("::error::Original signing certificate was not found among relevant keystore/password Secrets, or they are inaccessible to this repository.")
              sys.exit(1)
          password,alias=found
          # Use the store password for the PKCS12 key entry as required by Android's signing config.
          env_file=Path(os.environ["GITHUB_ENV"])
          with env_file.open("a") as output:
              output.write("KANONHA_SIGNING_STORE="+str(tmp)+"\n")
              output.write("KANONHA_SIGNING_ALIAS="+alias+"\n")
              output.write("KANONHA_SIGNING_STORE_PASSWORD="+password+"\n")
              output.write("KANONHA_SIGNING_KEY_PASSWORD="+password+"\n")
          print("::add-mask::"+password)
          print("Original installed release signing certificate confirmed. Secrets remain on the GitHub runner.")
          PY
      - name: Build APK signed with original certificate
        run: gradle :app:assembleRelease --no-daemon
      - name: Validate upgrade package ID, version and cryptographic signature
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "^package: name='ir.kanonha.app' versionCode='26'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apk-cert.txt"
          grep -Eqi 'Signer #1 certificate SHA-256 digest: 49acf93724a85d76ea26f10511b152b0d443e8ac0ef2d7a882dbc229b26453d5' "$RUNNER_TEMP/apk-cert.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/apk-cert.txt"
          echo "PASS: same original release signing certificate; package ir.kanonha.app; versionCode 26."
          sha256sum "$APK"
      - name: Upload verified installable signed upgrade
        uses: actions/upload-artifact@v4
        with:
          name: Kanonha-0.9.11-RELEASE-SIGNED-UPGRADE
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Purge temporary signing key
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/kanonha-release.p12" "$RUNNER_TEMP/apk-cert.txt"
