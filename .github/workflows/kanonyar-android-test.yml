name: Kanonyar Android APK test build

on:
  push:
    branches:
      - test/androidharness-ci-build
    paths:
      - 'android/**'
      - '.github/workflows/kanonyar-android-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build both Android apps (Debug)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build both debug APKs
        working-directory: android
        run: gradle --no-daemon --stacktrace :management-app:assembleDebug :student-app:assembleDebug
      - name: Upload management APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kanonyar-management-debug
          path: android/management-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload student APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kanonyar-student-debug
          path: android/student-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
