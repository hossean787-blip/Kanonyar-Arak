name: Kanonha v0.9.10 persistent Persian calendar
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Validate offline UI and SVG assets
        run: |
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/student-calendar.js
          node --check app/src/main/assets/biometric.js
          node --check tests/academic-biometric-smoke.cjs
          node --check tests/biometric-relogin-smoke.cjs
          node --check tests/login-redesign-smoke.cjs
          node --check tests/signup-clean-ui-smoke.cjs
          node --check tests/signup-validation-smoke.cjs
          node --check app/src/main/assets/jalali.js
          node --check tests/jalali-auth-ux-smoke.cjs
          node --check tests/ui-smoke.cjs
          node --check app/src/main/assets/backend.js
          node --check app/src/main/assets/ratings.js
          node --check app/src/main/assets/ratings-admin.js
          node --check tests/ratings-manager-smoke.cjs
          node --check tests/ratings-smoke.cjs
          node --check app/src/main/assets/config.js
          node --check tests/backend-smoke.cjs
          node --check tests/online-ui-smoke.cjs
          node --check tests/live-api-smoke.cjs
          node --check app/src/main/assets/secretary.js
          node --check app/src/main/assets/admin.js
          node --check tests/unified-auth-smoke.cjs
          node --check tests/admin-ui-smoke.cjs
          node --check tests/multi-role-ui-smoke.cjs
          node --check tests/role-workspaces-smoke.cjs
          node --check tests/multi-role-auth-smoke.cjs
          node --check tests/live-identity-smoke.cjs
          deno check supabase/functions/kanonha-student-auth/index.ts
          deno check supabase/functions/kanonha-admin-console/index.ts
          node --check tests/secretary-backend-smoke.cjs
          node --check tests/secretary-ui-smoke.cjs
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=Path('app/src/main/assets')
          html=(root/'index.html').read_text(encoding='utf-8')
          for name in ('home','clubs','events','activity','profile'):
              assert 'data-screen="'+name+'"' in html, name
          for name in ('styles.css','app.js','backend.js','secretary.js','admin.js','config.js','biometric.js','student-calendar.js','student-calendar.css'):
              assert (root/name).is_file(), name
          for svg in (root/'assets').glob('*.svg'):
              ET.parse(svg)
          assert len(list((root/'assets').glob('*.svg'))) >= 16
          for name in ('home','clubs','events','activity','profile'):
              assert (root/'assets'/f'nav-{name}.svg').is_file(), name
          for name in ('book','tech','leaf','science','sport'):
              assert (root/'assets'/f'club-{name}.svg').is_file(), name
          assert (root/'assets'/'azad-university-logo.svg').is_file()
          app_root=Path('app/src/main')
          manifest=(app_root/'AndroidManifest.xml').read_text(encoding='utf-8')
          assert 'android:label="کانون‌ها"' in manifest
          assert 'همراه' not in html + manifest
          for name in ('notification_jalali.xml',):
              ET.parse(app_root/'res'/'layout'/name)
          for name in ('calendar_notice_background.xml','calendar_notice_badge.xml'):
              ET.parse(app_root/'res'/'drawable'/name)
          for name in ('ic_launcher.xml','ic_launcher_round.xml'):
              ET.parse(app_root/'res'/'mipmap-anydpi-v26'/name)
          ET.parse(app_root/'res'/'drawable'/'ic_kanonha_foreground.xml')
          receiver=(app_root/'java'/'ir'/'kanonha'/'app'/'DailyCalendarReceiver.java').read_text(encoding='utf-8')
          assert 'setOngoing(true)' in receiver
          assert 'setOnlyAlertOnce(true)' in receiver
          assert 'setCustomContentView(view)' in receiver
          assert 'setSmallIcon(dateIcon())' in receiver
          assert 'R.layout.notification_jalali' in receiver
          assert 'set(Calendar.HOUR_OF_DAY,0)' in receiver
          assert 'POST_NOTIFICATIONS' in manifest
          assert 'RECEIVE_BOOT_COMPLETED' in manifest
          assert 'BOOT_COMPLETED' in manifest
          assert 'WEEKDAYS' in receiver
          assert 'setContentText(today())' in receiver
          assert 'setAutoCancel(true)' not in receiver
          print('UI, persistent Persian calendar, and SVG assets valid')
          PY
      - name: Smoke-test navigation, offline state and Android Back bridge
        run: node tests/ui-smoke.cjs
      - name: Verify online API, RLS schema and account isolation
        run: |
          node tests/backend-smoke.cjs
          node tests/online-ui-smoke.cjs
          node tests/ratings-smoke.cjs
          node tests/ratings-manager-smoke.cjs
          node tests/secretary-backend-smoke.cjs
          node tests/secretary-ui-smoke.cjs
          node tests/unified-auth-smoke.cjs
          node tests/admin-ui-smoke.cjs
          node tests/multi-role-ui-smoke.cjs
          node tests/jalali-auth-ux-smoke.cjs
          node tests/academic-biometric-smoke.cjs
          node tests/biometric-relogin-smoke.cjs
          node tests/login-redesign-smoke.cjs
          node tests/signup-clean-ui-smoke.cjs
          node tests/signup-validation-smoke.cjs
          node tests/role-workspaces-smoke.cjs
          node tests/multi-role-auth-smoke.cjs
      - name: Verify real isolated Supabase Data API and anonymous RLS
        run: |
          node tests/live-api-smoke.cjs
          node tests/live-identity-smoke.cjs
        continue-on-error: true # External service timeout must not block local APK compilation
      - name: Build Android Debug and Release candidate
        run: gradle :app:assembleDebug :app:assembleRelease --no-daemon
      - name: Verify package identity, version, release output and no embedded signing keys
        run: |
          set -eu
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          test -f app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/release/app-release-unsigned.apk >/dev/null
          ! find app/src -type f -name '*.jks' | grep -q .
          ! find app/src -type f -name '*.keystore' | grep -q .
          ! find app/src -type f -name '*.p12' | grep -q .
          grep -q 'applicationId = "ir.kanonha.app"' app/build.gradle.kts
          grep -q 'versionCode = 25' app/build.gradle.kts
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          echo 'Release output validated; unsigned candidate requires secure external signing'
      - uses: actions/upload-artifact@v4
        with:
          name: kanonha-0.9.10-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: kanonha-0.9.10-debug-validation
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
