name: Kanonha signed in-place upgrade APK (survey navigation QA)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore only explicitly named release signing Secrets
        shell: bash
        env:
          SIGNING_B64: ${{ secrets.KANONHA_SIGNING_KEYSTORE_BASE64 || secrets.KANONHA_RELEASE_KEYSTORE_BASE64 || secrets.KANONHA_RELEASE_P12_BASE64 || secrets.KANONHA_KEYSTORE_BASE64 || secrets.SIGNING_KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 || secrets.KANONHA_SIGNING_STORE }}
          STORE_PASS: ${{ secrets.KANONHA_SIGNING_STORE_PASSWORD || secrets.KANONHA_RELEASE_STORE_PASSWORD || secrets.KANONHA_RELEASE_PASSWORD || secrets.KANONHA_KEYSTORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD || secrets.RELEASE_KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KANONHA_SIGNING_ALIAS || secrets.KANONHA_RELEASE_ALIAS || secrets.RELEASE_KEY_ALIAS || secrets.KANONHA_KEY_ALIAS || secrets.KEY_ALIAS || 'kanonha-release' }}
          KEY_PASS: ${{ secrets.KANONHA_SIGNING_KEY_PASSWORD || secrets.KANONHA_RELEASE_KEY_PASSWORD || secrets.KANONHA_KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          if [[ -z "$SIGNING_B64" || -z "$STORE_PASS" ]]; then
            echo "::error::Explicitly named signing keystore/password Secrets not available to this repository. Provide Secret NAMES only; do not send passwords."
            exit 1
          fi
          printf '%s' "$SIGNING_B64" | base64 --decode > "$RUNNER_TEMP/kanonha-release.p12"
          chmod 600 "$RUNNER_TEMP/kanonha-release.p12"
          if [[ -z "$KEY_PASS" ]]; then KEY_PASS="$STORE_PASS"; fi
          CERT_REPORT=$(keytool -list -v -keystore "$RUNNER_TEMP/kanonha-release.p12" -storepass "$STORE_PASS" -alias "$KEY_ALIAS")
          if ! grep -Fqi '49:AC:F9:37:24:A8:5D:76:EA:26:F1:05:11:B1:52:B0:D4:43:E8:AC:0E:F2:D7:A8:82:DB:C2:29:B2:64:53:D5' <<< "$CERT_REPORT"; then
            echo "::error::Signing key does not match installed 0.9.5 release certificate."
            exit 1
          fi
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          echo "KANONHA_SIGNING_STORE=$RUNNER_TEMP/kanonha-release.p12" >> "$GITHUB_ENV"
          echo "KANONHA_SIGNING_STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "KANONHA_SIGNING_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KANONHA_SIGNING_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          echo "Original release certificate verified; no signing secrets disclosed."
      - name: Build APK signed with original certificate
        run: gradle :app:assembleRelease --no-daemon
      - name: Validate upgrade package ID, version and cryptographic signature
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "^package: name='ir.kanonha.app' versionCode='31'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apk-cert.txt"
          grep -Eqi 'Signer #1 certificate SHA-256 digest: 49acf93724a85d76ea26f10511b152b0d443e8ac0ef2d7a882dbc229b26453d5' "$RUNNER_TEMP/apk-cert.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/apk-cert.txt"
          echo "PASS: same original release signing certificate; package ir.kanonha.app; versionCode 31."
          sha256sum "$APK"
      - name: Upload verified installable signed upgrade
        uses: actions/upload-artifact@v4
        with:
          name: Kanonha-0.9.16-RELEASE-SIGNED-UPGRADE
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Purge temporary signing key
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/kanonha-release.p12" "$RUNNER_TEMP/apk-cert.txt"
